# Test ortamı: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
services:
  db:
    image: mariadb:10.11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_turkish_ci
    environment:
      MYSQL_DATABASE: efsanebaharat
      MYSQL_USER: efsanebaharat
      MYSQL_PASSWORD: test_pass
      MYSQL_ROOT_PASSWORD: test_root
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: efsanebaharat
      DB_USER: efsanebaharat
      DB_PASS: test_pass
    depends_on:
      db:
        condition: service_healthy

  tests:
    image: efsanebaharat-test-runner
    build:
      context: .
      dockerfile: tests/Dockerfile
    working_dir: /app
    environment:
      APP_URL: http://app
      DB_HOST: db
      DB_NAME: efsanebaharat
      DB_USER: efsanebaharat
      DB_PASS: test_pass
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    command: ["sh", "-c", "composer install --no-interaction --no-progress -q && ! (find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l | grep -v '^No syntax errors') && vendor/bin/phpunit"]
