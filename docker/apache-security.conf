# Sunucu bilgilerini gizle
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Yüklenen dosyalar (kalıcı volume) hiçbir koşulda PHP olarak çalıştırılmaz
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php\d?|phtml|phar|pht|cgi|pl|py|sh|shtml)$">
        Require all denied
    </FilesMatch>
</Directory>

# Uygulama dışı / hassas dizinler
<DirectoryMatch "^/var/www/html/(includes|logs|temp|db-init|sql|tests|docker|vendor|node_modules|\.git)(/|$)">
    Require all denied
</DirectoryMatch>
